<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Focusinsight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/forgot-password.css">
</head>
<body>

    <!-- Bahagian Logo Atas -->
    <div class="logo-container">
        <div class="logo-box">
            <!-- Ganti src ini dengan path gambar logo Focusinsight kau kalau perlu -->
            <img src="images/company-logo.jpg" alt="Focusinsight"> 
        </div>
    </div>

    <!-- Kad Info Sahaja -->
    <div class="forgot-card">
        <h1>Forgot your password</h1>
        
        <p>Passwords can only be reset by the System Administrator.</p>
        
        <p>Please contact your administrator or the HR Department to request password reset.</p>

        <div class="admin-info">
            <div class="info-row">
                <span class="icon">📩</span> <span>admin@focusinsight.com</span>
            </div>
            <div class="info-row">
                <span class="icon">☎️</span> <span>+60 1235667</span>
            </div>
        </div>

        <div class="back-link-container">
            <a href="index.html" class="back-link">Back to login</a>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer-text">
        @2026 Focusinsight Sdn. Bhd. All rights reserved
    </div>

</body>
</html>
