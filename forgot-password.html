<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Focusinsight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #BCE3E6; /* Warna biru muda sejagat macam dalam gambar */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .logo-container {
            margin-bottom: 24px;
        }

        /* Gaya untuk logo putih Focusinsight */
        .logo-box {
            background: #ffffff;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-box img {
            height: 45px;
            display: block;
        }

        /* Kad putih utama */
        .forgot-card {
            background: #F4F7FC; /* Warna putih kebiruan lembut */
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: left;
        }

        .forgot-card h1 {
            font-size: 26px;
            font-weight: 500;
            color: #000000;
            margin-bottom: 24px;
        }

        .forgot-card p {
            font-size: 15px;
            color: #333333;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Bahagian info admin */
        .admin-info {
            margin-top: 24px;
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-row {
            display: flex;
            align-items: center;
            font-size: 15px;
            color: #000000;
        }

        .info-row .icon {
            margin-right: 10px;
            font-size: 16px;
            display: inline-block;
            width: 20px;
            text-align: center;
        }

        /* Pautan Back to login */
        .back-link-container {
            text-align: center;
        }

        .back-link {
            font-size: 16px;
            color: #0056b3;
            text-decoration: underline;
            font-weight: 500;
        }

        .back-link:hover {
            color: #003d82;
        }

        /* Hak cipta di bahagian bawah sekali */
        .footer-text {
            margin-top: 60px;
            font-size: 12px;
            color: #7A9A9D;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Bahagian Logo Atas -->
    <div class="logo-container">
        <div class="logo-box">
            <!-- Ganti src ini dengan path gambar logo Focusinsight kau kalau perlu -->
            <img src="images/company-logo.jpg" alt="Focusinsight"> 
        </div>
    </div>

    <!-- Kad Info Sahaja -->
    <div class="forgot-card">
        <h1>Forgot your password</h1>
        
        <p>Passwords can only be reset by the System Administrator.</p>
        
        <p>Please contact your administrator or the HR Department to request password reset.</p>

        <div class="admin-info">
            <div class="info-row">
                <span class="icon">📩</span> <span>admin@focusinsight.com</span>
            </div>
            <div class="info-row">
                <span class="icon">☎️</span> <span>+60 1235667</span>
            </div>
        </div>

        <div class="back-link-container">
            <a href="index.html" class="back-link">Back to login</a>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer-text">
        @2026 Focusinsight Sdn. Bhd. All rights reserved
    </div>

</body>
</html>
