<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Department - FocusInsight HR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <!-- HR Security Guard -->
    <script src="../js/auth_check.js"></script>
    <link rel="stylesheet" href="../assets/css/hr/add-department.css">
</head>
<body>

    <!-- HEADER TOP BAR -->
    <header class="page-header">
        <div class="brand-logo">
            <img src="../images/company-logo.jpg" alt="FocusInsight Logo">
        </div>
        <div class="header-actions">
            <div class="search-pill">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search request">
            </div>
            <button class="header-icon-btn"><i class="fa-regular fa-bell"></i></button>
            <a href="profile-hr.html" class="user-profile-menu">
                <div class="user-avatar-circle">
                    <i class="fa-solid fa-user"></i>
                </div>
                <i class="fa-solid fa-chevron-down dropdown-chevron"></i>
            </a>
        </div>
    </header>

    <!-- FORM CONTAINER -->
    <main class="form-container">
        <h1 class="page-title">Add New Department</h1>

        <div class="section-badge">Department Information</div>

        <form id="addDepartmentForm">
            <div class="form-group">
                <label class="form-label" for="deptName">Department Name</label>
                <input type="text" id="deptName" class="form-input" placeholder="Enter department name" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="deptHead">Head of Department</label>
                <input type="text" id="deptHead" class="form-input" placeholder="Enter head of department" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="dateCreated">Date Created</label>
                <input type="text" id="dateCreated" class="form-input" value="06 - Aug - 2026">
            </div>

            <div class="form-group">
                <label class="form-label" for="deptDesc">Department Description</label>
                <textarea id="deptDesc" class="form-textarea" placeholder="Enter department responsibilities and description..."></textarea>
            </div>

            <!-- EMPLOYEE LIST CARD -->
            <div class="table-card">
                <div class="table-header-title">
                    <span>Employee List</span>
                    <a href="add-employee.html" id="btnAddEmp" class="btn-add-employee">+ Add Employee</a>
                </div>
                <table class="employee-table">
                    <thead>
                        <tr>
                            <th style="width: 25%;">Employee ID</th>
                            <th style="width: 45%;">Employee Name</th>
                            <th style="width: 30%;">Position</th>
                        </tr>
                    </thead>
                    <tbody id="employeeTableBody">
                        <tr><td>&nbsp;</td><td></td><td></td></tr>
                        <tr><td>&nbsp;</td><td></td><td></td></tr>
                        <tr><td>&nbsp;</td><td></td><td></td></tr>
                        <tr><td>&nbsp;</td><td></td><td></td></tr>
                        <tr><td>&nbsp;</td><td></td><td></td></tr>
                    </tbody>
                </table>
            </div>

            <!-- ACTION BUTTONS -->
            <div class="bottom-actions">
                <a href="departments.html" class="btn-action-back">Back</a>
                <button type="submit" class="btn-action-save">Save</button>
            </div>
        </form>
    </main>

    <script src="../assets/js/hr/add-department.js"></script>
</body>
</html>
