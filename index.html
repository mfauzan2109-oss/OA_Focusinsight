<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OA Approval Portal - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 40px;
            box-sizing: border-box;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6b7280;
            font-size: 18px;
            user-select: none;
        }

        .toggle-password:hover {
            color: #1f2937;
        }
    </style>
</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-header">
            <div class="logo-placeholder">
                <img src="images/company-logo.jpg" class="clean-logo" alt="Focusinsight Logo">
            </div>
            <h2>OA Approval Portal</h2>
            <p class="subtitle">Sign in to access your workspace</p>
        </div>

        <div class="login-card">
            <form id="loginForm">
                <div class="input-group">
                    <label for="employee-id">Employee ID<span class="required">*</span></label>
                    <input type="text" id="employee-id" placeholder="e.g. EMP001" required>
                </div>

                <div class="input-group">
                    <label for="password">Password<span class="required">*</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <i class="bx bx-hide toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="forgot-password.html" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn-sign-in">Sign In</button>
            </form>
            <div id="errorMsg"
                style="color: red; text-align: center; margin-top: 15px; font-weight: 500; display: none;"></div>
        </div>

        <div class="login-footer">
            <p>&copy; 2026 Focusinsight Sdn. Bhd. All rights reserved</p>
        </div>
    </div>

    <script>
        // Show / hide password toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            togglePassword.classList.toggle('bx-hide', !isHidden);
            togglePassword.classList.toggle('bx-show', isHidden);
        });

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault(); // Stop standard form submission refresh

            const user_id = document.getElementById('employee-id').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                // Post credentials directly to your live Node.js server
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id, password })
                });

                const data = await response.json();

                if (data.success) {
                    errorMsg.style.display = 'none';

                    // Save context variables into browser memory for dashboard populating & route restriction
                    sessionStorage.setItem('userId', data.user_id || user_id);
                    sessionStorage.setItem('username', data.name);
                    sessionStorage.setItem('position', data.position);
                    sessionStorage.setItem('department', data.department);

                    const dept = (data.department || '').toLowerCase();
                    const pos = (data.position || '').toLowerCase();

                    // Check if user belongs to HR
                    const isHR = dept.includes('hr') ||
                        dept.includes('human resources') ||
                        pos.includes('hr');

                    // Route user to appropriate module
                    if (isHR) {
                        window.location.href = 'hr/hr-dashboard.html';
                    } else if (pos === 'ceo' || pos === 'chairman') {
                        window.location.href = 'ceo-dashboard.html';
                    } else if (pos === 'manager') {
                        window.location.href = 'dashboard-manager.html';
                    } else if (pos === 'supervisor') {
                        window.location.href = 'dashboard-supervisor.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    // Show validation denial reasons from your database records
                    errorMsg.textContent = data.message;
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                errorMsg.textContent = 'Server unreachable. Ensure node server.js is running.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
