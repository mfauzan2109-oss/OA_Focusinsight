<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruitment Requisition Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .main-content { padding: 0 !important; }
        .form-body { padding: 0 24px 40px 24px; max-width: 900px; margin: 0 auto; }

        .profile-avatar img, .avatar-circle img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
        }
        .profile-avatar, .avatar-circle {
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        .top-header {
            position: sticky; top: 0; z-index: 100;
            background: #ffffff; border-bottom: 1px solid #e2e8f0;
            padding: 14px 24px; margin-bottom: 24px;
            width: 100%; box-sizing: border-box;
            display: flex; align-items: center; justify-content: space-between;
        }

        .form-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 22px 24px;
            margin-bottom: 20px;
        }

        .form-card-title {
            font-size: 14px;
            font-weight: 800;
            color: #030c1b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .position-block {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .position-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .position-title {
            font-size: 14px;
            font-weight: 700;
            color: #2563eb;
        }

        .position-remove-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .accordion-item {
            border-top: 1px solid #eef2f7;
        }

        .accordion-item:first-of-type { border-top: none; }

        .accordion-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            color: #030c1b;
            background: #ffffff;
            transition: background 0.15s ease;
        }

        .accordion-header:hover { background: #f8fafc; }

        .accordion-header i {
            transition: transform 0.2s ease;
            font-size: 16px;
            color: #64748b;
        }

        .accordion-header.open i { transform: rotate(180deg); }

        .accordion-body {
            display: none;
            padding: 4px 16px 18px 16px;
        }

        .accordion-body.open { display: block; }

        .add-position-btn {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 9px 18px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .add-position-btn:hover { background: #1d4ed8; }

        .recruitment-info-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .summary-card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        .summary-card-title {
            font-size: 13px;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 4px;
        }

        .summary-card-body {
            font-size: 14px;
            font-weight: 700;
            color: #030c1b;
            margin-bottom: 2px;
        }

        .summary-card-meta {
            font-size: 12px;
            color: #64748b;
        }

        .summary-edit-link {
            font-size: 12px;
            font-weight: 700;
            color: #2563eb;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
            white-space: nowrap;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }

        .btn-cancel {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
            padding: 10px 22px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-submit {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 10px 26px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-submit:hover { background: #1d4ed8; }

        .empty-summary {
            font-size: 13px;
            color: #94a3b8;
            padding: 10px 0;
        }

        .input-group textarea {
            width: 100%;
            resize: vertical;
            font-family: inherit;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon input {
            width: 100%;
            padding-right: 34px;
            box-sizing: border-box;
        }

        .input-with-icon i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 15px;
            pointer-events: none;
        }

        .file-dropzone {
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            padding: 28px 16px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
            cursor: pointer;
            background: #f8fafc;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .file-dropzone:hover, .file-dropzone.dragover {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .file-dropzone i {
            font-size: 26px;
            color: #94a3b8;
            display: block;
            margin-bottom: 8px;
        }

        .file-dropzone .browse-link {
            color: #2563eb;
            font-weight: 700;
            text-decoration: underline;
        }

        .file-dropzone .file-hint {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .file-selected-name {
            margin-top: 10px;
            font-size: 12px;
            font-weight: 600;
            color: #030c1b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .file-selected-name i {
            color: #16a34a;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-logo">
             <img src="images/company-logo.jpg" class="clean-logo" alt="Focusinsight Logo">
        </div>

        <a href="profile.html" class="user-profile" style="text-decoration: none; display: flex;">
            <div class="profile-avatar" id="sidebarAvatarContainer"><i class='bx bx-user'></i></div>
            <div class="profile-info">
                <h4 id="sidebarName">Loading...</h4>
                <p id="sidebarMeta">Loading...</p>
            </div>
        </a>

        <nav class="nav-menu">
            <a href="approval-queue.html" class="nav-item" id="approvalQueueItem" style="display: none;">
                <i class='bx bx-check-shield'></i>
                <span>Approval Queue</span>
                <span class="nav-badge" id="approvalQueueBadge" style="display: none;">0</span>
            </a>

            <a href="dashboard.html" class="nav-item"><i class='bx bx-grid-alt'></i> Dashboard</a>
            <a href="my-request.html" class="nav-item"><i class='bx bx-file'></i> My Request</a>
            <a href="application-center.html" class="nav-item active"><i class='bx bx-calendar-check'></i> Application Center</a>
        </nav>

        <div class="sidebar-footer">
            <a href="index.html" class="nav-item logout-item"><i class='bx bx-log-out'></i> Sign Out</a>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <div class="header-title">
                <h1>Recruitment Requisition Form</h1>
            </div>

            <div class="header-actions">
                <div class="search-box">
                    <i class='bx bx-search'></i>
                    <input type="text" id="searchInput" placeholder="Search request...">
                </div>

                <div class="notification-container">
                    <button class="noti-bell-btn" id="notiBellBtn" title="Notifications">
                        <i class="fa-regular fa-bell"></i>
                        <span class="noti-badge" id="notiBadge">0</span>
                    </button>
                    <div class="notification-dropdown" id="notiDropdown">
                        <div class="noti-header">
                            <h3>Notifications</h3>
                            <button id="refreshNotiBtn" class="btn-mark-read">Refresh</button>
                        </div>
                        <div class="noti-body" id="notiList">
                            <div style="padding: 16px; text-align: center; color: #94a3b8; font-size: 13px;">Loading notifications...</div>
                        </div>
                        <div class="noti-footer">
                            <a href="my-request.html" class="view-all-link">View All Requests</a>
                        </div>
                    </div>
                </div>

                <div class="top-bar-divider"></div>

                <a href="profile.html" style="text-decoration: none;">
                    <div class="avatar-circle" id="topAvatar">--</div>
                </a>
            </div>
        </header>

        <div class="form-body">

            <!-- REQUEST INFORMATION -->
            <div class="form-card">
                <div class="form-card-title">Request Information</div>
                <div class="form-grid form-grid-2">
                    <div class="input-group">
                        <label>Requested By</label>
                        <input type="text" id="requestedBy" readonly>
                    </div>
                    <div class="input-group">
                        <label>Position</label>
                        <input type="text" id="requesterPosition" readonly>
                    </div>
                </div>
                <div class="form-grid form-grid-2">
                    <div class="input-group">
                        <label>Department</label>
                        <input type="text" id="requesterDepartment" readonly>
                    </div>
                    <div class="input-group">
                        <label>Request Date</label>
                        <input type="text" id="requestDate" readonly>
                    </div>
                </div>
            </div>

            <!-- RECRUITMENT INFORMATION -->
            <div class="form-card">
                <div class="recruitment-info-header">
                    <div class="form-card-title" style="margin-bottom: 0;">Recruitment Information</div>
                    <button type="button" class="add-position-btn" onclick="addPosition()">
                        <i class='bx bx-plus'></i> Add Position
                    </button>
                </div>
                <div id="positionsContainer"></div>
            </div>

            <!-- RECRUITMENT SUMMARY -->
            <div class="form-card">
                <div class="form-card-title">Recruitment Summary</div>
                <div id="summaryContainer"></div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" id="btnCancel">Cancel</button>
                <button type="button" class="btn-submit" id="btnSubmit">Submit</button>
            </div>

        </div>
    </main>

    <script>
    document.addEventListener('DOMContentLoaded', async function() {
        const username = sessionStorage.getItem('username');
        const userId = sessionStorage.getItem('userId');
        const position = sessionStorage.getItem('position');
        const department = sessionStorage.getItem('department');

        if (!username || !userId) {
            alert("Access Denied! Please log in first.");
            window.location.href = "index.html";
            return;
        }

        const formattedUserId = userId.toUpperCase();

        // ==============================================================
        // MANAGER-ONLY PAGE ACCESS
        // ==============================================================
        const isManager = (userId && formattedUserId.startsWith('MGR')) ||
                          (position && position.toLowerCase().includes('manager'));

        if (!isManager) {
            alert("Access Denied! This page is only available to managers.");
            window.location.href = "dashboard.html";
            return;
        }

        // ==============================================================
        // SIDEBAR / TOP HEADER: PROFILE INFO
        // ==============================================================
        document.getElementById('sidebarName').textContent = username;
        document.getElementById('sidebarMeta').textContent = `${formattedUserId} . ${department || 'General'}`;
        document.getElementById('requestedBy').value = `${formattedUserId} - ${username}`;
        document.getElementById('requesterPosition').value = position || '';
        document.getElementById('requesterDepartment').value = department || 'General';
        document.getElementById('requestDate').value = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

        const approvalQueueItem = document.getElementById('approvalQueueItem');
        if (approvalQueueItem) approvalQueueItem.style.display = 'flex';

        const initials = username.split(' ').map(n => n.charAt(0)).join('').substring(0, 2).toUpperCase();
        const topAvatarEl = document.getElementById('topAvatar');
        const sidebarAvatarEl = document.getElementById('sidebarAvatarContainer');
        if (topAvatarEl) topAvatarEl.textContent = initials;

        try {
            const profRes = await fetch(`/api/profile/${formattedUserId}`);
            const profData = await profRes.json();
            if (profData.success && profData.data && profData.data.profile_picture) {
                const src = profData.data.profile_picture.startsWith('http')
                    ? profData.data.profile_picture
                    : `/${profData.data.profile_picture}`;
                const imgHTML = `<img src="${src}" alt="Profile Picture" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
                if (sidebarAvatarEl) sidebarAvatarEl.innerHTML = imgHTML;
                if (topAvatarEl) topAvatarEl.innerHTML = imgHTML;
            }
        } catch (err) {
            console.error('Error loading profile picture:', err);
        }

        // ==============================================================
        // NOTIFICATION SYSTEM
        // ==============================================================
        const notiBellBtn = document.getElementById('notiBellBtn');
        const notiDropdown = document.getElementById('notiDropdown');
        const notiList = document.getElementById('notiList');
        const notiBadge = document.getElementById('notiBadge');
        const refreshNotiBtn = document.getElementById('refreshNotiBtn');

        async function fetchNotifications() {
            try {
                const response = await fetch(`/api/notifications?employee_id=${encodeURIComponent(userId)}&department=${encodeURIComponent(department || '')}&position=${encodeURIComponent(position || '')}`);
                const data = await response.json();

                if (data.success && data.notifications && data.notifications.length > 0) {
                    const unreadCount = data.notifications.filter(item =>
                        item.is_reminder || (item.status || '').toLowerCase().includes('pending')
                    ).length;

                    if (notiList) {
                        notiList.innerHTML = '';
                        data.notifications.forEach(item => {
                            const statusLower = (item.status || '').toLowerCase();
                            let cardClass = 'status-pending';
                            let pillClass = 'pending';

                            if (item.is_reminder) {
                                cardClass = 'status-reminder'; pillClass = 'reminder';
                            } else if (statusLower.includes('approve') || statusLower === 'completed') {
                                cardClass = 'status-approved'; pillClass = 'approved';
                            } else if (statusLower.includes('reject')) {
                                cardClass = 'status-rejected'; pillClass = 'rejected';
                            } else if (statusLower.includes('revision') || statusLower.includes('review')) {
                                cardClass = 'status-review'; pillClass = 'review';
                            }

                            const title = item.is_reminder
                                ? `🔔 ${item.message || (item.employee_name || 'Someone') + ': Reminder sent'}`
                                : `${item.type || 'Form'} (${item.form_no || ''})`;

                            const notiItem = document.createElement('a');
                            notiItem.href = `request-details.html?id=${item.id}&type=${encodeURIComponent(item.type || '')}`;
                            notiItem.className = `noti-card ${cardClass}`;
                            notiItem.innerHTML = `
                                <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
                                    <div>
                                        <p class="noti-card-title">${title}</p>
                                        <p class="noti-card-formno">${item.message && !item.is_reminder ? item.message : 'Form No: ' + (item.form_no || '')}</p>
                                        <p class="noti-card-date">${item.time || ''}</p>
                                    </div>
                                    <span class="noti-status-pill ${pillClass}">${item.is_reminder ? 'Reminder' : (item.status || 'Pending').toUpperCase()}</span>
                                </div>
                            `;
                            notiList.appendChild(notiItem);
                        });
                    }

                    if (notiBadge) {
                        if (unreadCount > 0) {
                            notiBadge.textContent = unreadCount > 99 ? '99+' : unreadCount;
                            notiBadge.style.display = 'flex';
                        } else {
                            notiBadge.style.display = 'none';
                        }
                    }
                } else {
                    if (notiBadge) notiBadge.style.display = 'none';
                    if (notiList) notiList.innerHTML = `<div style="padding: 16px; text-align: center; color: #94a3b8; font-size: 13px;">No notifications found.</div>`;
                }
            } catch (err) {
                console.error('Error fetching notifications:', err);
            }
        }

        if (notiBellBtn && notiDropdown) {
            notiBellBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                notiDropdown.classList.toggle('active');
                if (notiDropdown.classList.contains('active')) fetchNotifications();
            });
            document.addEventListener('click', (e) => {
                if (!notiDropdown.contains(e.target) && !notiBellBtn.contains(e.target)) {
                    notiDropdown.classList.remove('active');
                }
            });
            notiDropdown.addEventListener('click', (e) => e.stopPropagation());
        }
        if (refreshNotiBtn) {
            refreshNotiBtn.addEventListener('click', (e) => { e.stopPropagation(); fetchNotifications(); });
        }
        fetchNotifications();
        setInterval(fetchNotifications, 30000);

        // ==============================================================
        // RECRUITMENT POSITIONS: DYNAMIC ADD / EXPAND / SUMMARY
        // ==============================================================
        let positions = [];
        let positionCounter = 0;

        function createPosition() {
            positionCounter++;
            return {
                id: positionCounter,
                // 1. Employment Information
                positionTitle: '', recruitmentType: 'New Position', employeeReplaced: '',
                vacancies: 1, employmentType: 'Full Time', workLocation: '', requiredStartDate: '',
                reason: '',
                // 2. Job Requirement
                jobDescription: '', keyResponsibilities: '', qualification: '', skills: '', experience: '',
                // 3. Compensation & Budget
                salaryRange: '', budgetCostCenter: '', hiringPriority: 'Medium', recruitmentSource: 'Internal',
                supportingDocumentName: '',
                openSections: { 1: true, 2: false, 3: false }
            };
        }

        function addPosition() {
            const pos = createPosition();
            positions.push(pos);
            renderPositions();
            renderSummary();
            setTimeout(() => {
                const el = document.getElementById(`position-block-${pos.id}`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 50);
        }

        function removePosition(posId) {
            if (positions.length <= 1) {
                alert('At least one position is required.');
                return;
            }
            positions = positions.filter(p => p.id !== posId);
            renderPositions();
            renderSummary();
        }

        function updatePositionField(posId, field, value) {
            const pos = positions.find(p => p.id === posId);
            if (pos) {
                pos[field] = value;
                renderSummary();
            }
        }

        function toggleAccordion(posId, sectionNum) {
            const pos = positions.find(p => p.id === posId);
            if (pos) pos.openSections[sectionNum] = !pos.openSections[sectionNum];
            renderPositions();
        }

        function editPosition(posId) {
            const pos = positions.find(p => p.id === posId);
            if (pos) pos.openSections[1] = true;
            renderPositions();
            setTimeout(() => {
                const el = document.getElementById(`position-block-${pos.id}`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 50);
        }

        function renderPositions() {
            const container = document.getElementById('positionsContainer');
            container.innerHTML = positions.map((pos, idx) => `
                <div class="position-block" id="position-block-${pos.id}">
                    <div class="position-block-header">
                        <span class="position-title">Position ${idx + 1}</span>
                        ${positions.length > 1 ? `<button type="button" class="position-remove-btn" onclick="removePosition(${pos.id})"><i class='bx bx-trash'></i> Remove</button>` : ''}
                    </div>

                    <div class="accordion-item">
                        <div class="accordion-header ${pos.openSections[1] ? 'open' : ''}" onclick="toggleAccordion(${pos.id}, 1)">
                            <span>1. EMPLOYMENT INFORMATION</span>
                            <i class='bx bx-chevron-down'></i>
                        </div>
                        <div class="accordion-body ${pos.openSections[1] ? 'open' : ''}">
                            <div class="input-group">
                                <label>Position Title<span class="required">*</span></label>
                                <input type="text" value="${pos.positionTitle}" placeholder="e.g. Software Engineer" oninput="updatePositionField(${pos.id}, 'positionTitle', this.value)">
                            </div>
                            <div class="form-grid form-grid-2">
                                <div class="input-group">
                                    <label>Recruitment Type<span class="required">*</span></label>
                                    <select onchange="updatePositionField(${pos.id}, 'recruitmentType', this.value)">
                                        <option value="New Position" ${pos.recruitmentType === 'New Position' ? 'selected' : ''}>New Position</option>
                                        <option value="Replacement" ${pos.recruitmentType === 'Replacement' ? 'selected' : ''}>Replacement</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label>Employee being replaced<span class="required">*</span></label>
                                    <div class="input-with-icon">
                                        <input type="text" value="${pos.employeeReplaced}" placeholder="Search employee" oninput="updatePositionField(${pos.id}, 'employeeReplaced', this.value)">
                                        <i class='bx bx-search'></i>
                                    </div>
                                </div>
                            </div>
                            <div class="form-grid form-grid-2">
                                <div class="input-group">
                                    <label>Number of Vacancy<span class="required">*</span></label>
                                    <input type="number" min="1" value="${pos.vacancies}" oninput="updatePositionField(${pos.id}, 'vacancies', this.value)">
                                </div>
                                <div class="input-group">
                                    <label>Employment Type<span class="required">*</span></label>
                                    <select onchange="updatePositionField(${pos.id}, 'employmentType', this.value)">
                                        <option value="" ${pos.employmentType === '' ? 'selected' : ''}></option>
                                        <option value="Full Time" ${pos.employmentType === 'Full Time' ? 'selected' : ''}>Full Time</option>
                                        <option value="Part Time" ${pos.employmentType === 'Part Time' ? 'selected' : ''}>Part Time</option>
                                        <option value="Contract" ${pos.employmentType === 'Contract' ? 'selected' : ''}>Contract</option>
                                        <option value="Internship" ${pos.employmentType === 'Internship' ? 'selected' : ''}>Internship</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-grid form-grid-2">
                                <div class="input-group">
                                    <label>Work Location<span class="required">*</span></label>
                                    <input type="text" value="${pos.workLocation}" placeholder="e.g. Kuala Lumpur HQ" oninput="updatePositionField(${pos.id}, 'workLocation', this.value)">
                                </div>
                                <div class="input-group">
                                    <label>Required Start Date<span class="required">*</span></label>
                                    <input type="date" value="${pos.requiredStartDate}" oninput="updatePositionField(${pos.id}, 'requiredStartDate', this.value)">
                                </div>
                            </div>
                            <div class="input-group">
                                <label>Reason for Recruitment<span class="required">*</span></label>
                                <textarea rows="3" placeholder="Please provide your reason." oninput="updatePositionField(${pos.id}, 'reason', this.value)">${pos.reason}</textarea>
                            </div>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <div class="accordion-header ${pos.openSections[2] ? 'open' : ''}" onclick="toggleAccordion(${pos.id}, 2)">
                            <span>2. JOB REQUIREMENT</span>
                            <i class='bx bx-chevron-down'></i>
                        </div>
                        <div class="accordion-body ${pos.openSections[2] ? 'open' : ''}">
                            <div class="input-group">
                                <label>Job Description<span class="required">*</span></label>
                                <textarea rows="3" placeholder="Please provide job description." oninput="updatePositionField(${pos.id}, 'jobDescription', this.value)">${pos.jobDescription}</textarea>
                            </div>
                            <div class="input-group">
                                <label>Key Responsibilities<span class="required">*</span></label>
                                <textarea rows="3" placeholder="Please provide key responsibilities." oninput="updatePositionField(${pos.id}, 'keyResponsibilities', this.value)">${pos.keyResponsibilities}</textarea>
                            </div>
                            <div class="input-group">
                                <label>Minimum Qualification<span class="required">*</span></label>
                                <input type="text" value="${pos.qualification}" placeholder="e.g. Bachelor's Degree" oninput="updatePositionField(${pos.id}, 'qualification', this.value)">
                            </div>
                            <div class="input-group">
                                <label>Required Skills<span class="required">*</span></label>
                                <textarea rows="2" placeholder="e.g. Python, SQL, Machine Vision" oninput="updatePositionField(${pos.id}, 'skills', this.value)">${pos.skills}</textarea>
                            </div>
                            <div class="input-group">
                                <label>Required Experience<span class="required">*</span></label>
                                <textarea rows="2" placeholder="e.g. 2-3 years" oninput="updatePositionField(${pos.id}, 'experience', this.value)">${pos.experience}</textarea>
                            </div>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <div class="accordion-header ${pos.openSections[3] ? 'open' : ''}" onclick="toggleAccordion(${pos.id}, 3)">
                            <span>3. COMPENSATION & BUDGET</span>
                            <i class='bx bx-chevron-down'></i>
                        </div>
                        <div class="accordion-body ${pos.openSections[3] ? 'open' : ''}">
                            <div class="form-grid form-grid-2">
                                <div class="input-group">
                                    <label>Salary Range (RM)<span class="required">*</span></label>
                                    <input type="text" value="${pos.salaryRange}" placeholder="e.g. 3,000 - 5,000" oninput="updatePositionField(${pos.id}, 'salaryRange', this.value)">
                                </div>
                                <div class="input-group">
                                    <label>Budget / Cost Center<span class="required">*</span></label>
                                    <input type="text" value="${pos.budgetCostCenter}" placeholder="e.g. CC-1023" oninput="updatePositionField(${pos.id}, 'budgetCostCenter', this.value)">
                                </div>
                            </div>
                            <div class="form-grid form-grid-2">
                                <div class="input-group">
                                    <label>Hiring Priority<span class="required">*</span></label>
                                    <select onchange="updatePositionField(${pos.id}, 'hiringPriority', this.value)">
                                        <option value="Urgent" ${pos.hiringPriority === 'Urgent' ? 'selected' : ''}>Urgent</option>
                                        <option value="High" ${pos.hiringPriority === 'High' ? 'selected' : ''}>High</option>
                                        <option value="Medium" ${pos.hiringPriority === 'Medium' ? 'selected' : ''}>Medium</option>
                                        <option value="Low" ${pos.hiringPriority === 'Low' ? 'selected' : ''}>Low</option>
                                    </select>
                                </div>
                                <div class="input-group">
                                    <label>Recruitment Source<span class="required">*</span></label>
                                    <select onchange="updatePositionField(${pos.id}, 'recruitmentSource', this.value)">
                                        <option value="Internal" ${pos.recruitmentSource === 'Internal' ? 'selected' : ''}>Internal</option>
                                        <option value="Job Portal" ${pos.recruitmentSource === 'Job Portal' ? 'selected' : ''}>Job Portal</option>
                                        <option value="Agency" ${pos.recruitmentSource === 'Agency' ? 'selected' : ''}>Agency</option>
                                        <option value="Referral" ${pos.recruitmentSource === 'Referral' ? 'selected' : ''}>Referral</option>
                                        <option value="Campus Hiring" ${pos.recruitmentSource === 'Campus Hiring' ? 'selected' : ''}>Campus Hiring</option>
                                    </select>
                                </div>
                            </div>
                            <div class="input-group">
                                <label>Supporting Document (if applicable)</label>
                                <div class="file-dropzone" id="dropzone-${pos.id}" onclick="document.getElementById('fileInput-${pos.id}').click()">
                                    <i class='bx bx-cloud-upload'></i>
                                    Drag & drop or <span class="browse-link">Browse files</span>
                                    <div class="file-hint">PDF, JPG, PNG up to 5MB</div>
                                    ${pos.supportingDocumentName ? `<div class="file-selected-name"><i class='bx bx-check-circle'></i> ${pos.supportingDocumentName}</div>` : ''}
                                    <input type="file" id="fileInput-${pos.id}" accept=".pdf,.jpg,.jpeg,.png" style="display:none;" onclick="event.stopPropagation()" onchange="handleFileSelect(${pos.id}, this.files)">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            positions.forEach(pos => {
                const dz = document.getElementById(`dropzone-${pos.id}`);
                if (!dz) return;
                dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('dragover'); });
                dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
                dz.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dz.classList.remove('dragover');
                    if (e.dataTransfer.files && e.dataTransfer.files.length) {
                        handleFileSelect(pos.id, e.dataTransfer.files);
                    }
                });
            });
        }

        function handleFileSelect(posId, files) {
            if (!files || !files.length) return;
            const file = files[0];
            const maxSize = 5 * 1024 * 1024;
            if (file.size > maxSize) {
                alert('File exceeds 5MB limit. Please choose a smaller file.');
                return;
            }
            const pos = positions.find(p => p.id === posId);
            if (pos) {
                pos.supportingDocumentFile = file;
                pos.supportingDocumentName = file.name;
                renderPositions();
            }
        }
        window.handleFileSelect = handleFileSelect;

        function renderSummary() {
            const container = document.getElementById('summaryContainer');
            if (positions.length === 0) {
                container.innerHTML = `<div class="empty-summary">No positions added yet.</div>`;
                return;
            }
            container.innerHTML = positions.map((pos, idx) => `
                <div class="summary-card">
                    <div>
                        <div class="summary-card-title">Position ${idx + 1}</div>
                        <div class="summary-card-body">${pos.positionTitle || 'Untitled Position'}</div>
                        <div class="summary-card-meta">${pos.vacancies || 0} vacancy${pos.vacancies == 1 ? '' : 'ies'} . ${pos.recruitmentType}</div>
                    </div>
                    <button type="button" class="summary-edit-link" onclick="editPosition(${pos.id})">[edit]</button>
                </div>
            `).join('');
        }

        window.addPosition = addPosition;
        window.removePosition = removePosition;
        window.updatePositionField = updatePositionField;
        window.toggleAccordion = toggleAccordion;
        window.editPosition = editPosition;

        // Start with one position, matching the reference design (Position 1 pre-added)
        addPosition();

        // ==============================================================
        // FORM ACTIONS
        // ==============================================================
        document.getElementById('btnCancel').addEventListener('click', () => {
            window.location.href = 'application-center.html';
        });

        document.getElementById('btnSubmit').addEventListener('click', async () => {
            const invalidPos = positions.find(p => !p.positionTitle || !p.workLocation || !p.vacancies || !p.employmentType || !p.requiredStartDate);
            if (invalidPos) {
                alert('Please fill in all required fields (marked *) for every position before submitting.');
                return;
            }

            const payload = {
                requested_by: username,
                requester_id: formattedUserId,
                requester_department: department || 'General',
                requester_position: position || '',
                request_date: new Date().toISOString().slice(0, 10),
                positions: positions.map(p => ({
                    position_title: p.positionTitle,
                    recruitment_type: p.recruitmentType,
                    employee_being_replaced: p.employeeReplaced,
                    vacancies: p.vacancies,
                    employment_type: p.employmentType,
                    work_location: p.workLocation,
                    required_start_date: p.requiredStartDate,
                    reason_for_recruitment: p.reason,
                    job_description: p.jobDescription,
                    key_responsibilities: p.keyResponsibilities,
                    qualification: p.qualification,
                    skills: p.skills,
                    experience: p.experience,
                    salary_range: p.salaryRange,
                    budget_cost_center: p.budgetCostCenter,
                    hiring_priority: p.hiringPriority,
                    recruitment_source: p.recruitmentSource,
                    supporting_document: p.supportingDocumentName || null
                }))
            };

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Submitting...';

            try {
                const res = await fetch('/api/submit-recruitment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();

                if (result.success) {
                    alert('Recruitment requisition submitted successfully!');
                    window.location.href = 'my-request.html';
                } else {
                    alert(result.message || 'Failed to submit form. Please try again.');
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Submit';
                }
            } catch (err) {
                console.error('Submit error:', err);
                alert('Failed to submit form. Please verify server connection.');
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Submit';
            }
        });
    });
    </script>

</body>
</html>
